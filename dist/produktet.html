<!doctype html>
<html lang="sq">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <meta
      name="description"
      content="Katalogu i modeleve të telefonave, motorëve elektrikë, trotinetave, tabletave dhe aksesorëve të ZIPO Mobil Shop."
    />
    <title>Produktet — ZIPO Mobil Shop</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link
      rel="preload"
      href="assets/instrument-sans.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="style.css" />
    <script src="catalog.js" defer></script>
    <script src="site.js" defer></script>
  </head>
  <body data-page="catalog">
    <a class="skip-link" href="#kryesore">Kalo te përmbajtja</a>
    <header class="site-header" id="header"></header>
    <main class="wrap catalog-main" id="kryesore">
      <div id="catalog-view">
        <nav class="breadcrumb" aria-label="Vendndodhja">
          <a href="index.html">Ballina</a><span>/</span> Produktet
        </nav>
        <div class="catalog-top">
          <h1>Katalogu i produkteve<span class="accent">.</span></h1>
          <p>Eksploro modelet dhe kontakto dyqanin për zgjedhjen tënde.</p>
        </div>
        <form class="catalog-search" role="search" id="search-form">
          <span data-icon="search"></span
          ><label class="sr-only" for="catalog-search">Kërko produkt</label>
          <input
            type="search"
            id="catalog-search"
            name="q"
            autocomplete="off"
            placeholder="Kërko sipas produktit ose markës…"
          />
        </form>
        <div
          class="filter-list"
          role="group"
          aria-label="Filtro sipas kategorisë"
          id="filters"
        ></div>
        <div class="catalog-status" aria-live="polite" id="result-count"></div>
        <div class="product-grid catalog-grid" id="product-grid"></div>
        <p class="catalog-note">
          Katalog ilustrues. Dyqani konfirmon çmimin dhe disponueshmërinë e
          secilit model.
        </p>
      </div>
      <div id="detail-view" hidden></div>
    </main>
    <footer id="kontakt"></footer>
  </body>
</html>
